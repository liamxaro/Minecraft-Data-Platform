minecraft_data_platform:
  target: dev_silver

  outputs:

    dev_silver:
      type: duckdb
      path: "{{ env_var('DBT_SILVER_PATH') }}"

      threads: "{{ env_var('DBT_THREADS', '1') | int }}"

      settings:
        memory_limit: "{{ env_var('DBT_MEMORY_LIMIT', '14GB') }}"
        preserve_insertion_order: false

      attach:
        - path: "{{ env_var('DBT_BRONZE_PATH') }}"
          alias: bronze
          read_only: true


    dev_gold:
      type: duckdb
      path: "{{ env_var('DBT_GOLD_PATH') }}"

      threads: "{{ env_var('DBT_THREADS', '1') | int }}"

      settings:
        memory_limit: "{{ env_var('DBT_MEMORY_LIMIT', '14GB') }}"
        preserve_insertion_order: false

      attach:
        - path: "{{ env_var('DBT_BRONZE_PATH') }}"
          alias: bronze
          read_only: true

        - path: "{{ env_var('DBT_SILVER_PATH') }}"
          alias: silver
          read_only: true


    test_silver:
      type: duckdb
      path: "{{ env_var('DBT_SILVER_PATH') }}"

      threads: "{{ env_var('DBT_THREADS', '1') | int }}"

      settings:
        memory_limit: "{{ env_var('DBT_MEMORY_LIMIT', '14GB') }}"
        preserve_insertion_order: false

      attach:
        - path: "{{ env_var('DBT_BRONZE_PATH') }}"
          alias: bronze
          read_only: true


    test_gold:
      type: duckdb
      path: "{{ env_var('DBT_GOLD_PATH') }}"

      threads: "{{ env_var('DBT_THREADS', '1') | int }}"

      settings:
        memory_limit: "{{ env_var('DBT_MEMORY_LIMIT', '14GB') }}"
        preserve_insertion_order: false

      attach:
        - path: "{{ env_var('DBT_BRONZE_PATH') }}"
          alias: bronze
          read_only: true

        - path: "{{ env_var('DBT_SILVER_PATH') }}"
          alias: silver
          read_only: true


    prod_silver:
      type: duckdb
      path: "{{ env_var('DBT_SILVER_PATH') }}"

      threads: "{{ env_var('DBT_THREADS', '1') | int }}"

      settings:
        memory_limit: "{{ env_var('DBT_MEMORY_LIMIT', '14GB') }}"
        preserve_insertion_order: false

      attach:
        - path: "{{ env_var('DBT_BRONZE_PATH') }}"
